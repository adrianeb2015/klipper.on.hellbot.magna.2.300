# ============================================================
# Hellbot Magna 2 300 — MKS Robin Nano V1.2
# Conversión: hotend Dragonburner + extrusor Sherpa Mini
#
# Config traducida desde el Marlin del workspace (config validada):
#  - steps X/Y 80, Z 400, E 282 (Sherpa Mini pancake 0.9°, 16 µsteps)
#  - volumen 300x300x400
#  - endstops NO (disparo en LOW, pullup)
#  - origen Y corrido -50mm (offset del cabezal nuevo)
#  - bed mesh manual (sin sonda)
# Flashear Klipper: STM32F103 / bootloader 28KiB / crystal 8MHz / USART3
# ============================================================

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
# OJO: ajustar al ID real que liste:  ls /dev/serial/by-id/
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 2000
max_z_velocity: 6
max_z_accel: 100
square_corner_velocity: 5.0

# ---------------- Steppers (A4988/stock drivers) ----------------

[stepper_x]
step_pin: PE3
dir_pin: !PE2          # invertido igual que Marlin (invert_x_dir... verificar con home)
enable_pin: !PE4
microsteps: 16
rotation_distance: 40   # GT2 + 16 dientes = 80 steps/mm
endstop_pin: ^PA15      # X- endstop NO (pullup, dispara LOW)
position_min: 0
position_max: 300
homing_speed: 50
homing_retract_dist: 5

[stepper_y]
step_pin: PE0
dir_pin: !PB9
enable_pin: !PE1
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA12      # Y- endstop NO
position_min: -50       # offset del cabezal: home físico = Y-50
position_max: 300
homing_speed: 50
homing_retract_dist: 5
#.home_xy_position: OJO — ver nota de homing abajo

[stepper_z]
step_pin: PB5
dir_pin: !PB4
enable_pin: !PB8
microsteps: 16
rotation_distance: 8    # tornillo de 8mm de paso = 400 steps/mm
endstop_pin: ^PA11      # Z- endstop NO
position_min: 0
position_max: 400
homing_speed: 6
homing_retract_dist: 2

[extruder]
step_pin: PD6
dir_pin: !PD3
enable_pin: !PB3
microsteps: 16
rotation_distance: 22.675   # Sherpa Mini 0.9° (= 282 steps/mm)
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC3             # HEATER 0
sensor_type: Semitec 104GT-2   # equivale a TEMP_SENSOR_0 5 en Marlin
sensor_pin: PC1             # TH1
min_temp: 0
max_temp: 300
min_extrude_temp: 170
max_power: 1.0
control: pid
pid_kp: 22.2                # valores default; recalibrar con PID_CALIBRATE
pid_ki: 1.08
pid_kd: 114
pressure_advance: 0.0       # calibrar después (test de torre)
#pressure_advance_smooth_time: 0.040

[heater_bed]
heater_pin: PA0             # HEATER BED
sensor_type: EPCOS 100K B57560G104F   # NTC de cama stock; verificar con lectura
sensor_pin: PC0             # TB1
min_temp: 0
max_temp: 130
control: pid
pid_kp: 65.0
pid_ki: 1.2
pid_kd: 900

# ---------------- Ventiladores ----------------

[fan]                       # fan de parte fría (FAN0 = PB1)
pin: PB1
kick_start_time: 0.5
off_below: 0.10

[heater_fan hotend_fan]     # fan del hotend Dragonburner (FAN1 = PB0)
pin: PB0
heater: extruder
heater_temp: 50
fan_speed: 1.0

# ---------------- Homing ----------------

[safe_z_home]
home_xy_position: 150, 100   # centro de la cama para homear Z
z_hop: 5
speed: 50

# Nota: con el offset de Y, al homear X/Y la boquilla queda en (0, -50).
# G-code y bed mesh usan coordenadas de cama (0..300), el origen físico quedó atrás.

# ---------------- Bed mesh manual (sin sonda) ----------------

[bed_mesh]
speed: 100
horizontal_move_z: 5
mesh_min: 20, 20
mesh_max: 280, 280
probe_count: 5, 5
manual_probe: true          # nivelación guiada con papel, como MBL
fade_start: 1.0
fade_end: 10.0

# ---------------- Macros ----------------

[gcode_macro G29]
gcode:
    SAVE_GCODE_STATE NAME=mbl_state
    G28
    BED_MESH_CALIBRATE
    RESTORE_GCODE_STATE NAME=mbl_state

[gcode_macro PRINT_START]
gcode:
    M117 Calefaccionando...
    G28
    G1 Z10 F600
    BED_MESH_PROFILE LOAD=default
    M104 S{params.HOTEND|default(210)}
    M140 S{params.CAMA|default(60)}
    M190 S{params.CAMA|default(60)}
    M109 S{params.HOTEND|default(210)}
    G1 Z5 F600
    M117 Listo

[gcode_macro PRINT_END]
gcode:
    M117 Terminado
    M104 S0
    M140 S0
    M107
    G91
    G1 Z10 F600
    G90
    G1 X150 Y290 F6000     # presentar pieza
    M84

# ---------------- Opcionales ----------------

